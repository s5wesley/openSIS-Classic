name: Deploy PHP Apache App with MySQL & Ngrok

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker
        uses: docker/setup-buildx-action@v2

      - name: Create Docker Network
        run: docker network create mynetwork

      - name: Start MySQL Database
        run: |
          docker run -d \
            --name mysql-db \
            --network mynetwork \
            -e MYSQL_ROOT_PASSWORD=mysecurepassword \
            -e MYSQL_DATABASE=mydatabase \
            -e MYSQL_USER=myuser \
            -e MYSQL_PASSWORD=userpassword \
            -p 3306:3306 \
            mysql:5.7 --sql-mode="" --default-authentication-plugin=mysql_native_password

          echo "Waiting for MySQL to start..."
          sleep 30  # Wait for MySQL to fully initialize

      - name: Verify MySQL is Running
        run: |
          docker exec mysql-db mysqladmin ping -h mysql-db -u root -pmysecurepassword

      - name: Grant Privileges to MySQL User
        run: |
          docker exec -i mysql-db mysql -u root -pmysecurepassword <<EOSQL
          GRANT ALL PRIVILEGES ON mydatabase.* TO 'myuser'@'%' IDENTIFIED BY 'userpassword';
          FLUSH PRIVILEGES;
          EOSQL

      - name: Restart MySQL to Apply Changes
        run: docker restart mysql-db

      - name: Build PHP Apache Docker Image
        run: docker build -t php-apache-app .

      - name: Run PHP Apache Container
        run: |
          docker run -d \
            --name php-apache-app \
            --network mynetwork \
            -p 80:80 \
            php-apache-app

      - name: Install Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok

      - name: Start Ngrok Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          nohup ngrok http 80 > /dev/null 2>&1 &

      - name: Get Ngrok Public URL
        run: |
          sleep 5
          NGROK_URL=$(curl --silent http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "Ngrok URL: $NGROK_URL"
          echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV

      - name: Keep Application Running for 5 Minutes
        run: |
          echo "Application is accessible at: $NGROK_URL"
          echo "Keeping application up for 5 minutes..."
          sleep 300  # 300 seconds = 5 minutes

      - name: Verify Logs (if fails)
        if: failure()
        run: |
          docker logs php-apache-app
          docker logs mysql-db

      - name: Stop and Clean Up
        if: always()
        run: |
          docker stop php-apache-app mysql-db
          docker rm php-apache-app mysql-db
          docker network rm mynetwork
